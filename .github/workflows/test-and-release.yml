name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
    push:
        branches:
            - "*"
        tags:
            # normal versions
            - "v[0-9]+.[0-9]+.[0-9]+"
            # pre-releases
            - "v[0-9]+.[0-9]+.[0-9]+-**"
    pull_request: {}

concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Runs the adapter's JavaScript regression suites independently from linting
    regression-tests:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Use Node.js 22.x
              uses: actions/setup-node@v7
              with:
                  node-version: "22.x"
                  cache: npm

            - name: Install Dependencies
              run: npm ci

            - name: Type-check source code
              run: npm run check

            - name: Run JavaScript regression tests
              run: npm run test:js

            - name: Test packed runtime installation
              run: npm run test:package-smoke

    # Performs quick checks before the expensive test runs
    check-and-lint:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        runs-on: ubuntu-latest

        steps:
            - name: Check and lint adapter
              uses: ioBroker/testing-action-check@v1
              with:
                  node-version: "22.x"
                  lint: true

    # Runs adapter tests on all supported node versions and OSes
    adapter-tests:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        needs: [check-and-lint, regression-tests]

        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                node-version: [22.x, 24.x]
                os: [ubuntu-latest, windows-latest, macos-latest]

        steps:
            - name: Test adapter
              uses: ioBroker/testing-action-adapter@v1
              with:
                  node-version: ${{ matrix.node-version }}
                  os: ${{ matrix.os }}

  # Deploys the final package to NPM
    deploy:
        needs: [regression-tests, check-and-lint, adapter-tests]

        # Trigger this step only when a commit on master is tagged with a version number
        if: |
            contains(github.event.head_commit.message, '[skip ci]') == false &&
            github.event_name == 'push' &&
            github.repository == 'iobroker-community-adapters/ioBroker.mihome-vacuum' &&
            startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write

        steps:
            - name: Publish npm package and create GitHub/Sentry releases
              uses: ioBroker/testing-action-deploy@v1
              with:
                  node-version: "22.x"
                  package-cache: "false"
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  sentry: true
                  sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  sentry-project: "iobroker-mihome-vacuum"
                  sentry-version-prefix: "iobroker.mihome-vacuum"
