                html += '<option value="' + entry.value + '"' + (selected ? ' selected' : '') + '>' + esc(entry.label) + '</option>';
            });
            if (!isNaN(current) && !found) html += '<option value="' + current + '" selected>' + esc(tr('current')) + ' (' + current + ')</option>';
            return html;
        }
        var connected = !!value(data['oid-connected']);
        var mapSource = value(data['oid-map']) || '';
        var mapOptions = has('oid-map-select') ? options(data['oid-map-select'], [], {}) : [];
        var mapValue = number(value(data['oid-map-select']));
        var vacuumStates = {0:'Unknown',1:'Initiating',2:'Sleeping',3:'Waiting',5:'Cleaning',6:'Returning to dock',7:'Manual mode',8:'Charging',9:'Charging error',10:'Paused',11:'Spot cleaning',12:'Error',13:'Shutting down',14:'Updating',15:'Docking',16:'Going to spot',17:'Zone cleaning',18:'Room cleaning',22:'Dust collecting',23:'Mop cleaning',26:'Going to mop cleaning',27:'Mop cleaning paused',28:'Drying mop',29:'Washing mop',30:'Mopping',31:'Cleaning and mopping',32:'Remote cleaning',33:'Inspecting water',34:'Charging complete',35:'Building map'};
        var vacuumStateValue = value(data['oid-state']);
        var vacuumStateNumber = number(vacuumStateValue);
        var vacuumState = isNaN(vacuumStateNumber)
            ? (typeof vacuumStateValue === 'string' && vacuumStateValue ? vacuumStateValue : tr('unknown'))
            : (trOpt('state_' + vacuumStateNumber) || vacuumStates[vacuumStateNumber] || (tr('unknown') + ' (' + vacuumStateNumber + ')'));
        var vacuumErrors = ['No error','Laser distance sensor error','Collision sensor error','Wheels on top of void, move robot','Clean hovering sensors, move robot','Clean main brush','Clean side brush','Main wheel stuck?','Device stuck, clean area','Dust collector missing','Clean filter','Stuck in magnetic barrier','Low battery','Charging fault','Battery fault','Wall sensors dirty, wipe them','Place me on flat surface','Side brushes problem, reboot me','Suction fan problem','Unpowered charging station','Remove Mop','Clean Mop Pad','Fresh Water Tank Dry','DROP','UNKNOWN','CLIFF','GESTURE','BUMPER_REPEAT','DROP_REPEAT','OPTICAL_FLOW','BOX','TANKBOX','WATERBOX_EMPTY','BOX_FULL','LEFT_WHEEL_MOTOR','RIGHT_WHEEL_MOTOR','TURN_SUFFOCATE','FORWARD_SUFFOCATE','CHARGER_GET','BATTERY_PERCENTAGE','HEART','CAMERA_OCCLUSION','MOVE','FLOW_SHIELDING','INFRARED_SHIELDING','CHARGE_NO_ELECTRIC','FAN_SPEED_ERROR','LEFTWHELL_SPEED','RIGHTWHELL_SPEED','BMI_ACCE','BMI_GYRO','XV','LEFT_MAGNET','RIGHT_MAGNET','FLOW_ERROR','INFRARED_FAULT','CAMERA_FAULT','WATER_PUMP','RTC','AUTO_KEY_TRIG','PV','CAMERA_IDLE','LDS_ERROR','LDS_BUMPER','WATER_PUMP_2','EDGE','CARPET','EDGE_2','ULTRASONIC','NO_GO_ZONE','ROUTE','ROUTE_2','BLOCKED_2','BLOCKED_3','RESTRICTED','RESTRICTED_2','RESTRICTED_3','MOP_REMOVED','MOP_REMOVED_2','MOP_PAD_STOP_ROTATE','MOP_PAD_STOP_ROTATE_2','BIN_FULL','BIN_OPEN','BIN_OPEN_2','BIN_FULL_2','WATER_TANK','DIRTY_WATER_TANK','DIRTY_WATER_TANK_2','DIRTY_WATER_TANK_BLOCKED','DIRTY_WATER_TANK_PUMP','MOP_PAD','WET_MOP_PAD','CLEAN_TANK_LEVEL','DIRTY_TANK_LEVEL','WASHBOARD_LEVEL'];
        var errorValue = value(data['oid-error']);
        var errorNumber = number(errorValue);
        var hasError = false;
        var error;
        if (!isNaN(errorNumber)) {
            if (errorNumber === 0) { error = tr('noError'); }
            else { hasError = true; error = trOpt('error_' + errorNumber) || vacuumErrors[errorNumber] || (tr('unknownError') + ' (' + errorNumber + ')'); }
        } else if (typeof errorValue === 'string' && errorValue) { error = errorValue; hasError = !/^no error$/i.test(errorValue); }
        else { error = tr('noError'); }
        var fanFallback = [
            { value: Number(data['oid-power-level-1']), label: tr('quiet') },
            { value: Number(data['oid-power-level-2']), label: tr('balanced') },
            { value: Number(data['oid-power-level-3']), label: tr('turbo') }
        ];
        var fanOptions = options(data['oid-power-level'], fanFallback, fanLabelKeys);
        var fan = number(value(data['oid-power-level']));
        var waterFallback = [{ value: 200, name: 'OFF' }, { value: 201, name: 'LOW' }, { value: 202, name: 'MEDIUM' }, { value: 203, name: 'HIGH' }, { value: 204, name: 'CUSTOM' }];
        var mopFallback = [{ value: 300, name: 'STANDARD' }, { value: 301, name: 'DEEP' }, { value: 303, name: 'DEEPPLUS' }];
        var waterOptions = has('oid-water') ? options(data['oid-water'], waterFallback, catalogLabelKeys) : [];
        var mopOptions = has('oid-mop-mode') ? options(data['oid-mop-mode'], mopFallback, catalogLabelKeys) : [];
        var carpetValue = value(data['oid-carpet']);
        var carpetOn = carpetValue === true || carpetValue === 'true' || carpetValue === 1 || carpetValue === '1';
        var showSettings = has('oid-water') || has('oid-mop-mode') || has('oid-carpet');
        var dockActions = [
            ['oid-dust-collect', 'dustCollect', 'deleteSweep'], ['oid-wash-mop', 'washMop', 'laundry'], ['oid-pause-wash-mop', 'pauseWashMop', 'pause'],
            ['oid-start-drying', 'startDrying', 'dry'], ['oid-stop-drying', 'stopDrying', 'stop']
        ].filter(function (action) { return has(action[0]); });
        var showDock = has('oid-dock-status') || dockActions.length > 0;
        var dockValue = value(data['oid-dock-status']);
        var dockNumber = number(dockValue);
        var dockCatalog = binds.catalog(data['oid-dock-status'], [{ value: 0, name: 'ok' }, { value: 1, name: 'Washing' }, { value: 2, name: 'Drying' }, { value: 3, name: 'Returning' }, { value: 4, name: 'Paused' }, { value: 5, name: 'Clean add Water' }, { value: 6, name: 'Adding Water' }, { value: 38, name: 'water empty' }, { value: 39, name: 'Waste water tank full' }]);
        var dockEntry = dockCatalog.filter(function (entry) { return entry.value === dockNumber; })[0];
        var dockLabel = dockValue === undefined || dockValue === null || dockValue === '' ? tr('unknown') : dockEntry ? catalogLabel(dockEntry.name, catalogLabelKeys) : String(dockValue);
        var dockName = dockEntry ? dockEntry.name.toUpperCase() : '';
        var dockLevel = isNaN(dockNumber) || dockNumber === 0 || dockName === 'OK' || dockName === 'IDLE' ? 'good' : (dockNumber >= 30 || /EMPTY|FULL|ERROR/.test(dockName)) ? 'critical' : 'busy';
        var showSchedule = isShown('show-schedule') && (has('oid-dnd') || has('oid-next-timer'));
        var dndValue = value(data['oid-dnd']);
        var dndOn = dndValue === true || dndValue === 'true' || dndValue === 1 || dndValue === '1';
        var nextTimer = value(data['oid-next-timer']);
        var consumables = [
            [tr('filter'), 'oid-filter', 'oid-filter-reset', 'filter'], [tr('mainBrush'), 'oid-main-brush', 'oid-main-brush-reset', 'cleaning'],
            [tr('sideBrush'), 'oid-side-brush', 'oid-side-brush-reset', 'cleaning'], [tr('sensors'), 'oid-sensors', 'oid-sensors-reset', 'tune'],
            [tr('waterFilter'), 'oid-water-filter', 'oid-water-filter-reset', 'filter'], [tr('mopPad'), 'oid-mop-pad', 'oid-mop-pad-reset', 'cleaning'],
            [tr('strainer'), 'oid-strainer', 'oid-strainer-reset', 'filter', true], [tr('cleaningBrush'), 'oid-cleaning-brush', 'oid-cleaning-brush-reset', 'cleaning', true],
            [tr('dustCollection'), 'oid-dust-collection', 'oid-dust-collection-reset', 'filter', true]
        ];
        var rooms = [1,2,3,4,5,6].map(function (index) { return { name: data['room-' + index + '-name'], start: data['room-' + index + '-start'], fan: data['room-' + index + '-fan'] }; }).filter(function (room) { return room.name && room.start; });
        var historyLimit = Math.max(1, Number(data['history-limit']) || 12);
        var history = [];
        try { var rawHistory = value(data['oid-history-json']); history = rawHistory ? (typeof rawHistory === 'string' ? JSON.parse(rawHistory) : rawHistory) : []; if (!Array.isArray(history)) history = []; } catch (e) { history = []; }
    %>
        <div class="vis-widget <%== data.attr('class') %> mihome-vacuum-widget" id="<%= data.attr('wid') %>" style="width: 100%; height: 100%;">
            <div class="vis-widget-body mihome-vacuum-card">
                <header class="mihome-vacuum-header">
                    <div class="mihome-vacuum-brand"><div class="mihome-vacuum-logo"><%== icon('cleaning') %></div><div class="mihome-vacuum-heading"><strong><%= data['vacuum-title'] || tr('defaultTitle') %></strong><span><%= vacuumState %></span></div></div>
                    <span class="mihome-vacuum-online <%= connected ? 'is-online' : 'is-offline' %>"><% if (connected) { %><%== icon('check') %> <% } %><%= connected ? tr('online') : tr('offline') %></span>
                </header>
                <nav class="mihome-vacuum-tabs"><button type="button" class="mihome-vacuum-tab active" data-panel="dashboard" onclick="vis.binds['mihome-vacuum'].showPanel(this, 'dashboard')"><%== icon('home') %> <%= tr('dashboard') %></button><% if (isShown('show-history')) { %><button type="button" class="mihome-vacuum-tab" data-panel="history" onclick="vis.binds['mihome-vacuum'].showPanel(this, 'history')"><%== icon('history') %> <%= tr('history') %></button><% } %></nav>
                <main class="mihome-vacuum-panels">
                    <section class="mihome-vacuum-panel active" data-page="dashboard">
                        <div class="mihome-vacuum-overview <%= isShown('show-map') ? '' : 'without-map' %>">
                            <% if (isShown('show-map')) { %><div class="mihome-vacuum-map"><% if (mapSource) { %><div class="mihome-vacuum-map-image" style="background-image: url('<%= mapSource %>');" role="img" aria-label="<%= tr('mapAlt') %>"></div><% } else { %><div class="mihome-vacuum-empty"><span><%== icon('map') %></span><%= tr('noMap') %></div><% } %><% if (mapOptions.length > 1 || has('oid-map-reload')) { %><div class="mihome-vacuum-map-tools"><% if (mapOptions.length > 1) { %><select aria-label="<%= tr('selectMap') %>" data-oid="<%= data['oid-map-select'] %>" onchange="vis.binds['mihome-vacuum'].setSelectValue(this)"><%== selectOptions(mapOptions, mapValue) %></select><% } %><% if (has('oid-map-reload')) { %><button type="button" title="<%= tr('reloadMap') %>" aria-label="<%= tr('reloadMap') %>" data-oid="<%= data['oid-map-reload'] %>" onclick="vis.binds['mihome-vacuum'].setValue(this)"><%== icon('refresh') %></button><% } %></div><% } %></div><% } %>
                            <aside class="mihome-vacuum-details">
                                <div class="mihome-vacuum-metrics"><div><span><%== icon('battery') %></span><strong><%= metric(data['oid-battery'], '%') %></strong><small><%= tr('battery') %></small></div><div><span><%== icon('squareFoot') %></span><strong><%= metric(data['oid-area'], 'm²') %></strong><small><%= tr('area') %></small></div><div><span><%== icon('schedule') %></span><strong><%= metric(data['oid-time'], 'min') %></strong><small><%= tr('time') %></small></div></div>
                                <label class="mihome-vacuum-box mihome-vacuum-fan"><small><%= tr('suctionPower') %></small><select data-oid="<%= data['oid-power-level'] %>" onchange="vis.binds['mihome-vacuum'].setSelectValue(this)"><%== selectOptions(fanOptions, fan) %></select></label>
                                <div class="mihome-vacuum-box mihome-vacuum-quick"><small><%= tr('quickControls') %></small><strong><%= vacuumState %></strong><div class="mihome-vacuum-controls"><button type="button" class="primary" data-oid="<%= data['oid-start'] %>" onclick="vis.binds['mihome-vacuum'].setValue(this)"><span><%== icon('play') %></span><%= tr('start') %></button><button type="button" data-oid="<%= data['oid-pause'] %>" onclick="vis.binds['mihome-vacuum'].setValue(this)"><span><%== icon('pause') %></span><%= tr('pause') %></button><button type="button" data-oid="<%= data['oid-home'] %>" onclick="vis.binds['mihome-vacuum'].setValue(this)"><span><%== icon('home') %></span><%= tr('dock') %></button><button type="button" data-oid="<%= data['oid-find'] %>" onclick="vis.binds['mihome-vacuum'].setValue(this)"><span><%== icon('locate') %></span><%= tr('find') %></button></div></div>
                                <div class="mihome-vacuum-box mihome-vacuum-health <%= hasError ? 'has-error' : '' %>"><small><%= tr('robotHealth') %></small><strong><%= error %></strong></div>
                            </aside>
                        </div>
                    </section>
                    <% if (showSettings || showDock || showSchedule) { %><section class="mihome-vacuum-panel active mihome-vacuum-strip" data-page="dashboard">
                        <% if (showSettings) { %><div class="mihome-vacuum-box mihome-vacuum-settings"><small><%= tr('cleaningSettings') %></small><div class="mihome-vacuum-fields">
                            <% if (has('oid-water')) { %><label><em><%== icon('waterDrop') %><%= tr('waterLevel') %></em><select aria-label="<%= tr('waterLevel') %>" data-oid="<%= data['oid-water'] %>" onchange="vis.binds['mihome-vacuum'].setSelectValue(this)"><%== selectOptions(waterOptions, number(value(data['oid-water']))) %></select></label><% } %>
                            <% if (has('oid-mop-mode')) { %><label><em><%== icon('waves') %><%= tr('mopRoute') %></em><select aria-label="<%= tr('mopRoute') %>" data-oid="<%= data['oid-mop-mode'] %>" onchange="vis.binds['mihome-vacuum'].setSelectValue(this)"><%== selectOptions(mopOptions, number(value(data['oid-mop-mode']))) %></select></label><% } %>
                            <% if (has('oid-carpet')) { %><label><em><%== icon('texture') %><%= tr('carpetMode') %></em><span class="mihome-vacuum-switch"><b><%= carpetOn ? tr('on') : tr('off') %></b><input type="checkbox" aria-label="<%= tr('carpetMode') %>" data-oid="<%= data['oid-carpet'] %>" <%= carpetOn ? 'checked' : '' %> onchange="vis.binds['mihome-vacuum'].setToggle(this)"><i></i></span></label><% } %>
                        </div></div><% } %>
                        <% if (showDock) { %><div class="mihome-vacuum-box mihome-vacuum-dock <%= dockLevel %>"><small><%= tr('dockStation') %></small><% if (has('oid-dock-status')) { %><strong><i></i><%= dockLabel %></strong><% } %><% if (dockActions.length) { %><div class="mihome-vacuum-controls"><% dockActions.forEach(function (action) { %><button type="button" data-oid="<%= data[action[0]] %>" onclick="vis.binds['mihome-vacuum'].setValue(this)"><span><%== icon(action[2]) %></span><%= tr(action[1]) %></button><% }); %></div><% } %></div><% } %>
                        <% if (showSchedule) { %><div class="mihome-vacuum-box mihome-vacuum-schedule"><div class="mihome-vacuum-schedule-head"><small><%= tr('schedule') %></small><% if (has('oid-dnd')) { %><span class="mihome-vacuum-chip <%= dndOn ? 'is-active' : '' %>"><%== icon('dnd') %> <%= tr('doNotDisturb') %>: <%= dndOn ? tr('dndActive') : tr('dndInactive') %></span><% } %></div><% if (has('oid-next-timer')) { %><strong><%== icon('timer') %> <%= tr('nextTimer') %>: <%= nextTimer || tr('unknown') %></strong><% } %></div><% } %>
                    </section><% } %>
                    <div class="mihome-vacuum-secondary">
                    <% if (rooms.length) { %><section class="mihome-vacuum-panel active" data-page="dashboard"><div class="mihome-vacuum-section-title"><span><%== icon('home') %></span><div><strong><%= tr('rooms') %></strong><small><%= tr('roomsSubtitle') %></small></div></div><div class="mihome-vacuum-rooms"><% rooms.forEach(function (room) { %><article><strong><%= room.name %></strong><select aria-label="<%= room.name %> <%= tr('suctionPower') %>" data-oid="<%= room.fan %>" onchange="vis.binds['mihome-vacuum'].setSelectValue(this)" <%= room.fan ? '' : 'disabled' %>><%== selectOptions(fanOptions, number(value(room.fan))) %></select><button type="button" data-oid="<%= room.start %>" onclick="vis.binds['mihome-vacuum'].setValue(this)"><%== icon('play') %> <%= tr('startRoom') %></button></article><% }); %></div></section><% } %>
                    <% if (isShown('show-maintenance')) { %><section class="mihome-vacuum-panel active" data-page="dashboard">
                        <div class="mihome-vacuum-section-title"><span><%== icon('build') %></span><div><strong><%= tr('maintenance') %></strong><small><%= tr('maintenanceSubtitle') %></small></div></div>
                        <div class="mihome-vacuum-consumables">
                            <% consumables.forEach(function (item) { var oid = data[item[1]]; var resetOid = data[item[2]]; var level = percentage(oid); if (value(oid) !== undefined) { %>
                            <article class="mihome-vacuum-consumable <%= item[4] ? 'counter' : level <= 15 ? 'critical' : level <= 35 ? 'warning' : '' %>"><div class="mihome-vacuum-consumable-head"><span><%== icon(item[3]) %></span><strong><%= item[0] %></strong><b><%= item[4] ? value(oid) : level + '%' %></b></div><% if (!item[4]) { %><div class="mihome-vacuum-progress"><i style="width:<%= level %>%"></i></div><% } else { %><div class="mihome-vacuum-progress-placeholder"></div><% } %><div class="mihome-vacuum-consumable-foot"><small><%= item[4] ? tr('usageCounter') : level <= 15 ? tr('replacement') : level <= 35 ? tr('checkSoon') : tr('goodCondition') %></small><button type="button" title="<%= tr('reset') %> <%= item[0] %>" aria-label="<%= tr('reset') %> <%= item[0] %>" data-label="<%= item[0] %>" data-confirm="<%= tr('reset') %> <%= item[0] %>? <%= tr('resetConfirm') %>" data-oid="<%= resetOid %>" onclick="vis.binds['mihome-vacuum'].resetConsumable(this)"><%== icon('restart') %></button></div></article>
                            <% } }); %>
                        </div>
                    </section><% } %>
                    </div>
                    <% if (isShown('show-history')) { %><section class="mihome-vacuum-panel" data-page="history">
                        <div class="mihome-vacuum-section-title"><span><%== icon('history') %></span><div><strong><%= tr('history') %></strong><small><%= tr('historySubtitle') %></small></div></div>
                        <div class="mihome-vacuum-history-summary"><div><span><%== icon('history') %></span><strong><%= metric(data['oid-history-cleanups'], '') %></strong><small><%= tr('totalCleanups') %></small></div><div><span><%== icon('squareFoot') %></span><strong><%= metric(data['oid-history-area'], 'm²') %></strong><small><%= tr('totalArea') %></small></div><div><span><%== icon('schedule') %></span><strong><%= metric(data['oid-history-time'], 'min') %></strong><small><%= tr('totalTime') %></small></div></div>
                        <div class="mihome-vacuum-history"><% if (history.length) { history.slice(0, historyLimit).forEach(function (row) { var failed = !!(row.Error || row.error || !(row.Ende ?? row.completed)); %><article><div><strong><%= row.Datum || row.date || '—' %></strong><small><%= row.Start || row.start || '—' %></small></div><div><strong><%= row['Fläche'] || row.area || '—' %></strong><small><%= tr('area') %></small></div><div><strong><%= row.Saugzeit || row.duration || '—' %></strong><small><%= tr('duration') %></small></div><span class="<%= failed ? 'failed' : 'success' %>" title="<%= failed ? tr('notCompleted') : tr('completed') %>"><%== icon(failed ? 'history' : 'check') %></span></article><% }); } else { %><div class="mihome-vacuum-empty"><span><%== icon('history') %></span><%= tr('noHistory') %></div><% } %></div>
                    </section><% } %>
                </main>
            </div>
        </div>
</script>
